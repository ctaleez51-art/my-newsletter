# 타깃 독자, 중요도 기준, 제외 조건
# select 노드가 이 내용을 기준 문장으로 읽는다.
# 제외 조건에 걸린 글도 버리지 않는다. 자세히 다루지 않을 뿐, 뉴스레터 목록에는 전부 실린다.

audience: 세금에 관심 있는 누구나. 특히 사업자와 세무사무실.

importance:
  - 어려운 세법 해설이나 판례보다, 공지사항·보도자료처럼 새로 나온 소식을 메인으로 다룬다.
  - 사업자나 세무사무실이 바로 알고 챙겨야 하는 소식(신고·납부·신청 기한, 제도 변경, 서비스 변경)을 앞에 둔다.

exclude:
  - 기관 관련 소식 (국세청의 수상·성과 홍보, 기관 행사·공모전, 인사, 조직 소식)

# 선별 묶음: 소스 종류로 나눈다. "새 소식이 메인"이라는 기준을 구조에도 반영하기 위해서다.
groups:
  소식: [국세청 보도자료, 국세청 공지사항, 홈택스 공지사항]
  법령: [판례·결정례, 최신개정법령]

per_group: 5        # 예선: 묶음마다 최대 몇 건을 올리는가
target: 5           # 본선: 최종 몇 건을 자세히 다루는가
